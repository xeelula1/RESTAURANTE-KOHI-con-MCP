<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unirme a la lista — Kōhi</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand-mark">
      <span class="brand-kanji">珈琲</span>
      <span class="brand-name-small">Kōhi</span>
    </a>
    <nav class="nav-links">
      <a href="/" class="nav-link">Inicio</a>
      <a href="/login.html" class="nav-link">Ya tengo cuenta</a>
    </nav>
  </header>

  <main class="main-container">
    <section class="card-panel">
      <span class="card-eyebrow">Lista de espera privada</span>
      <h1 class="card-title">Unirme a la lista</h1>
      <p class="card-description">
        Reserva tu lugar para la degustación inaugural de Kōhi.
      </p>

      <div id="alertBox" class="alert-box" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="name">Nombre completo</label>
          <input
            class="form-input"
            type="text"
            id="name"
            name="name"
            placeholder="Ej. Kenji Takahashi"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="kenji@kohi.com"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirmar contraseña</label>
          <input
            class="form-input"
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-full">
          Reservar mi posición
        </button>
      </form>

      <div class="form-footer">
        ¿Ya estás registrado? <a href="/login.html">Inicia sesión aquí</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    KŌHI SPECIALTY COFFEE • WAITLIST REGISTRY
  </footer>

  <script>
    const registerForm = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(type, message) {
      alertBox.className = `alert-box visible ${type === 'error' ? 'alert-error' : 'alert-success'}`;
      alertBox.textContent = message;
    }

    registerForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      alertBox.className = 'alert-box';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!name || !email || !password || !confirmPassword) {
        showAlert('error', 'Por favor completa todos los campos.');
        return;
      }

      if (password !== confirmPassword) {
        showAlert('error', 'Las contraseñas no coinciden.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Procesando...';

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          showAlert('error', data.error || 'No se pudo completar el registro.');
          return;
        }

        showAlert('success', `¡Estás en la lista! Tu posición: #${data.position}`);
        registerForm.reset();
      } catch (_err) {
        showAlert('error', 'Error de conexión con el servidor.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reservar mi posición';
      }
    });
  </script>
</body>
</html>
